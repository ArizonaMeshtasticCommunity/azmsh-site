name: Build and Deploy MkDocs

on:
  push:
    branches:
      - main
  pull_request:

# The org only allows actions pinned to these exact commits:
#   actions/checkout   3d3c42e5aac5ba805825da76410c181273ba90b1  (v7.0.1)
#   actions/setup-node 949feb2413d6458794dcd2491c4babbbce0c15c1  (v7.1.0)
#   astral-sh/setup-uv 68559e99cc807c1eb7e9238fd43a15bba460eec2  (v10.3.3)
# setup-python and upload-artifact are not allowed, so Python comes from uv
# and the pa11y report goes to the job summary instead of an artifact.

permissions:
  contents: read

env:
  # mkdocs 2 drops the plugin API this site's plugins use.
  MKDOCS_WITH: >-
    --with mkdocs<2
    --with mkdocs-material
    --with mkdocs-minify-plugin
    --with mkdocs-git-revision-date-localized-plugin
    --with mkdocs-glightbox

jobs:
  build:
    name: Test MkDocs Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Build site
        run: uvx $MKDOCS_WITH mkdocs build --strict

  accessibility:
    name: Accessibility Audit (Soft Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci

      - name: Build site
        run: uvx $MKDOCS_WITH mkdocs build --strict

      - name: Start local site server
        run: python3 -m http.server 8000 --directory site >/tmp/pa11y-server.log 2>&1 &

      - name: Wait for local site server
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Run pa11y-ci
        continue-on-error: true
        run: pa11y-ci | tee pa11y-results.txt

      - name: pa11y report
        if: always()
        run: |
          {
            echo '## pa11y (soft check)'
            echo '```'
            cat pa11y-results.txt 2>/dev/null || echo 'pa11y produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mkdocs gh-deploy pushes the gh-pages branch

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          uvx $MKDOCS_WITH mkdocs gh-deploy --strict --force --remote-name origin --message "Deployed from GitHub Actions"
